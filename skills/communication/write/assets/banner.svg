    <text x="99" y="419" font-size="36" font-weight="500">Your voice. Ready to paste.</text>
    <text x="100" y="463" font-size="21" opacity=".8">Bring the facts. Keep the personality.</text>
    <path d="M100 506h56" stroke="#20352F" stroke-width="2"/>
    <text x="174" y="513" font-size="16" letter-spacing="2">10 FORMATS. NOTHING SENT.</text>

    <!-- A hastily written source note, with visible editorial marks. -->
    <g transform="translate(940 78) rotate(-6 240 100)">
      <path d="M12 13H490V205H12Z" fill="#20352F" opacity=".12"/>
      <path d="M0 0H480V186L469 192 458 186 447 192 436 186 425 192 414 186 403 192 392 186 381 192 370 186 359 192 348 186 337 192 326 186 315 192 304 186 293 192 282 186 271 192 260 186 249 192 238 186 227 192 216 186 205 192 194 186 183 192 172 186 161 192 150 186 139 192 128 186 117 192 106 186 95 192 84 186 73 192 62 186 51 192 40 186 29 192 18 186 7 192 0 186Z" fill="#FFFDF5"/>
