      <g font-size="24" font-style="italic" font-family="Georgia, serif">
        <text x="63" y="77">hey, quick thing...</text>
        <text x="63" y="115">move the review to friday?</text>
        <text x="63" y="153">draft needs another pass</text>
      </g>
      <path d="M57 70l200 2m-198 8 193-13" stroke="#E7654C" stroke-width="2.5"/>
