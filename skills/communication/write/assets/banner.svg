      <rect x="12" y="13" width="610" height="216" fill="#20352F" opacity=".12"/>
      <rect width="610" height="216" fill="#FFFDF5"/>
      <rect width="7" height="216" fill="#20352F"/>
      <text x="33" y="37" font-size="12" letter-spacing="2.5">THE DRAFT / EMAIL</text>
      <path d="M33 53H574" stroke="#20352F" stroke-opacity=".16"/>
      <text x="33" y="93" font-size="25" font-weight="500">Could we move the review to Friday?</text>
      <text x="33" y="131" font-size="25">The draft needs another pass.</text>
      <path d="M34 177l8 8 15-19" fill="none" stroke="#20352F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="184" font-size="14" letter-spacing="1.3">SAME FACTS. CLEARER WORDS.</text>
      <g transform="translate(491 162) rotate(-9)">
        <rect x="-10" y="-14" width="90" height="43" rx="2" fill="#C6DAD0"/>
        <text x="35" y="13" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2">YOURS</text>
      </g>
    </g>
  </g>
