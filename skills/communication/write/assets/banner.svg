  <title>write — your voice, ready to paste</title>
  <desc>An editorial workbench: a rough note asking to move a review to Friday becomes a clear draft. A large italic write wordmark, coral proofreader marks, and overlapping paper sheets show the transformation. Drafting only; nothing is sent.</desc>
